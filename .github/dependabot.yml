# Keeps dependencies current without letting updates arrive faster than they can be reviewed.
#
# Go modules and GitHub Actions are grouped so one pull request carries a whole ecosystem's patch and
# minor updates. Major updates stay separate, because they need their own validation run.
version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/test/interop"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/test/interop"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      certbot:
        patterns:
          - "*"

  # The documentation toolchain is pinned in docs/requirements.txt and the site build runs with
  # --strict, so a MkDocs or theme release that changes a warning into an error breaks the build. That
  # is worth learning from a pull request rather than from the first push after a release.
  - package-ecosystem: pip
    directory: "/docs"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docs-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
