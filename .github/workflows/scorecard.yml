# Scores the repository against the OpenSSF Scorecard supply chain checks.
#
# Scorecard inspects how the repository is run rather than the code it holds: pinned actions, branch
# protection, a security policy, release provenance and so on. Findings are reported under Security,
# Code scanning, next to the CodeQL results. Uploading them needs code scanning, which is available for
# a public repository, so the job skips without starting a runner while the repository is private.
#
# Scorecard follows a successful CodeQL run so its SAST check sees the completed analysis instead of
# racing it. Repository configuration changes trigger it directly because they create no CodeQL run.
name: Scorecard

on:
  branch_protection_rule:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    name: Supply chain score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploading the results to the code scanning dashboard.
      security-events: write
      # Reading the branch protection and rulesets that the Branch-Protection check scores.
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Scorecard checks
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing lets a badge read the score and lets others see how it was reached. It sends
          # the result of a public repository to the OpenSSF, and nothing else.
          publish_results: true

      # The code scanning dashboard retains findings for a limited time, so the raw result stays
      # available for as long as the run does.
      - name: Keep the raw result with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Report the findings to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
