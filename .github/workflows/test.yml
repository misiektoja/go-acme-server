name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The toolchain follows go.mod rather than the newest stable release, so a Go release cannot
      # change what CI runs without a commit.
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # go mod tidy rewrites tracked files, so running it without this check would let CI repair a
      # stale go.mod and report success on a tree that no longer matches the commit.
      - name: Verify the module files are tidy
        run: make tidy-check

      - name: Check formatting
        run: make fmt-check

      - name: Run the tests
        env:
          ACME_TEST_SCRATCH: ${{ runner.temp }}/acme-tests
        run: make test
