name: Interoperability

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: Required client and recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/interop/go.sum

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Prepare isolated test state
        run: |
          python -m venv "$RUNNER_TEMP/certbot"
          echo "$RUNNER_TEMP/certbot/bin" >> "$GITHUB_PATH"

      - name: Install pinned clients
        run: |
          "$RUNNER_TEMP/certbot/bin/python" -m pip install --no-deps --only-binary=:all: --require-hashes -r test/interop/requirements.txt

      - name: Check client dependencies
        run: '"$RUNNER_TEMP/certbot/bin/python" -m pip check'

      - name: Check module files
        run: make tidy-check

      - name: Run required scenarios
        env:
          ACME_TEST_SCRATCH: ${{ runner.temp }}/acme-tests
        run: make test-interop

      - name: Upload sanitized outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interop-outcomes
          path: ${{ runner.temp }}/acme-tests/interop-summary.json
          if-no-files-found: error
          retention-days: 7

  required:
    name: Interoperability gate
    if: always()
    needs: interop
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every scenario
        env:
          RESULT: ${{ needs.interop.result }}
        run: test "$RESULT" = success
