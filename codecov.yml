# Codecov settings. The coverage checks inform pull requests and never block them.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

# Example programs and the test suites for other implementations are not library code.
ignore:
  - "examples"
  - "internal/slhdsatest"
  - "noncetest"
  - "storetest"
