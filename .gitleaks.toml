title = "go-acme-server"

[extend]
useDefault = true

[[allowlists]]
description = "Paths that never enter the repository or that hold build output only"
paths = [
  # Ignored directories checked for tracked files by the gitleaks Make target.
  '''^local/''',
  '''^\.cache/''',
  # Downloaded tool binaries.
  '''^bin/''',
]

[[allowlists]]
description = "Published RFC 7515 appendix A.1 HMAC test vector used by the JWS tests"
regexes = [
  '''AyM1SysPpbyDfgZld3umj1qzKObwVMkoqQ-EstJQLr_T-1qS0gZH75aKtMN3Yj0iPS4hcgUuTwjAzZr1Z9CAow''',
]
